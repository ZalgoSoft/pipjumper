<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Windows desktop with a PiP window that jumps away from the cursor">
  <defs>
    <linearGradient id="desktopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f35"/>
      <stop offset="48%" stop-color="#18365a"/>
      <stop offset="100%" stop-color="#0d1626"/>
    </linearGradient>
    <radialGradient id="desktopGlow" cx="72%" cy="26%" r="60%">
      <stop offset="0%" stop-color="#77b8ff" stop-opacity=".32"/>
      <stop offset="45%" stop-color="#77b8ff" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#77b8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="taskbarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12161e"/>
      <stop offset="100%" stop-color="#0c0f15"/>
    </linearGradient>
    <linearGradient id="titleBarLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#dce6f2"/>
    </linearGradient>
    <linearGradient id="titleBarDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233041"/>
      <stop offset="100%" stop-color="#151d2a"/>
    </linearGradient>
    <linearGradient id="videoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171a22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="playerStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f80ff"/>
      <stop offset="100%" stop-color="#1860d8"/>
    </linearGradient>
    <linearGradient id="pipBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#253142"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <filter id="cursorShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#desktopBg)"/>
  <rect width="1280" height="720" fill="url(#desktopGlow)"/>
  <circle cx="1030" cy="120" r="220" fill="#8fd0ff" opacity=".09"/>
  <circle cx="250" cy="170" r="150" fill="#9bc6ff" opacity=".05"/>
  <circle cx="1080" cy="540" r="280" fill="#0a5cff" opacity=".07"/>
  <path d="M0 610 C220 560, 420 560, 650 620 S1080 690, 1280 640 L1280 720 L0 720 Z" fill="#0a1220" opacity=".26"/>
  <g id="browser-window" filter="url(#shadow)">
    <rect x="90" y="74" width="760" height="520" rx="24" fill="#f6f8fc"/>
    <rect x="90" y="74" width="760" height="44" rx="24" fill="url(#titleBarLight)"/>
    <rect x="90" y="108" width="760" height="34" fill="#e6edf6"/>
    <rect x="120" y="82" width="170" height="26" rx="13" fill="#ffffff" opacity=".82"/>
    <circle cx="132" cy="95" r="5" fill="#ff5f57"/>
    <circle cx="148" cy="95" r="5" fill="#febc2e"/>
    <circle cx="164" cy="95" r="5" fill="#28c840"/>
    <rect x="122" y="116" width="694" height="18" rx="9" fill="#d6dfeb"/>
    <rect x="122" y="116" width="110" height="18" rx="9" fill="#9dbcf8"/>
    <rect x="110" y="154" width="720" height="418" rx="18" fill="#f3f6fb"/>
    <rect x="150" y="190" width="640" height="350" rx="18" fill="url(#videoBg)"/>
    <path d="M182 220 H758" stroke="#ffffff" stroke-opacity=".05" stroke-width="2"/>
    <path d="M182 510 H758" stroke="#ffffff" stroke-opacity=".04" stroke-width="2"/>
    <circle cx="470" cy="365" r="62" fill="#ffffff" opacity=".12"/>
    <polygon points="452,336 452,394 504,365" fill="#ffffff" opacity=".92"/>
    <rect x="168" y="520" width="672" height="16" rx="8" fill="#1f2430"/>
    <rect x="168" y="520" width="210" height="16" rx="8" fill="url(#playerStrip)"/>
    <circle cx="401" cy="528" r="8" fill="#ffffff"/>
    <rect x="176" y="544" width="48" height="10" rx="5" fill="#8893a3" opacity=".8"/>
    <rect x="230" y="544" width="78" height="10" rx="5" fill="#8893a3" opacity=".5"/>
    <rect x="638" y="538" width="84" height="22" rx="11" fill="#10151f" opacity=".88"/>
    <circle cx="657" cy="549" r="5" fill="#f3f6fb"/>
    <rect x="668" y="545" width="28" height="8" rx="4" fill="#f3f6fb" opacity=".8"/>
  </g>
  <g id="pip-window" transform="translate(850 120)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" values="170,150; 170,150; 850,120; 850,120; 400,300; 400,300; 700,450; 700,450; 170,150" keyTimes="0; 0.24; 0.25; 0.49; 0.50; 0.74; 0.75; 0.99; 1"/>
    <rect x="0" y="0" width="270" height="160" rx="18" fill="#10161e" stroke="#ecf3fb" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="30" rx="18" fill="url(#pipBar)"/>
    <rect x="0" y="15" width="270" height="15" fill="url(#pipBar)"/>
    <circle cx="18" cy="15" r="4" fill="#ffffff" opacity=".86"/>
    <circle cx="30" cy="15" r="4" fill="#ffffff" opacity=".55"/>
    <circle cx="42" cy="15" r="4" fill="#ffffff" opacity=".4"/>
    <rect x="18" y="48" width="234" height="76" rx="14" fill="url(#videoBg)"/>
    <circle cx="136" cy="86" r="27" fill="#ffffff" opacity=".14"/>
    <polygon points="126,72 126,100 150,86" fill="#ffffff" opacity=".9"/>
    <rect x="18" y="132" width="145" height="10" rx="5" fill="#7f8b9b" opacity=".82"/>
    <rect x="168" y="132" width="84" height="10" rx="5" fill="#7f8b9b" opacity=".38"/>
    <rect x="17" y="42" width="236" height="110" rx="16" fill="none" stroke="#7fd1ff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="0;0;1;0;1;0;1" keyTimes="0;0.31;0.33;0.64;0.66;0.98;1"/>
    </rect>
  </g>
  <g id="taskbar">
    <rect x="0" y="660" width="1280" height="60" fill="url(#taskbarBg)" opacity=".95"/>
    <rect x="0" y="658" width="1280" height="2" fill="#2e3850" opacity=".5"/>
    <g transform="translate(24 673)">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#1d2430"/>
      <rect x="8" y="8" width="8" height="8" fill="#5ec6ff"/>
      <rect x="18" y="8" width="8" height="8" fill="#5ec6ff"/>
      <rect x="8" y="18" width="8" height="8" fill="#5ec6ff"/>
      <rect x="18" y="18" width="8" height="8" fill="#5ec6ff"/>
    </g>
    <g transform="translate(76 673)" opacity=".95">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#1d2430"/>
      <circle cx="17" cy="17" r="9" fill="none" stroke="#b6c3d8" stroke-width="2"/>
      <circle cx="17" cy="17" r="4" fill="#b6c3d8"/>
    </g>
    <g transform="translate(128 673)" opacity=".95">
      <rect x="0" y="0" width="34" height="34" rx="8" fill="#1d2430"/>
      <rect x="8" y="8" width="18" height="18" rx="4" fill="#5ec6ff" opacity=".85"/>
    </g>
    <g transform="translate(209 673)" opacity=".9">
      <rect x="0" y="0" width="180" height="34" rx="10" fill="#1d2430"/>
      <text x="16" y="22" fill="#c8d4e6" font-size="14" font-family="Segoe UI, Arial, sans-serif">Video Player</text>
    </g>
    <g transform="translate(1116 670)">
      <rect x="0" y="0" width="140" height="36" rx="10" fill="#1d2430"/>
      <text x="16" y="23" fill="#c8d4e6" font-size="13" font-family="Segoe UI, Arial, sans-serif">11:42 AM</text>
    </g>
  </g>
  <g id="cursor" transform="translate(180 620)" filter="url(#cursorShadow)">
    <animateTransform attributeName="transform" type="translate" dur="8s" fill="freeze" repeatCount="indefinite" values="180,620; 300,200; 300,200;  850,250; 850,250; 500,300; 500,300; 700,450; 700,450" keyTimes="0; 0.24; 0.25; 0.49; 0.50; 0.74; 0.75; 0.99; 1"/>
    <polygon points="0,0 0,46 12,34 18,58 29,53 22,31 41,31" fill="#ffffff" stroke="#1f2329" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="15" cy="13" r="2.8" fill="#1f2329" opacity=".9"/>
  </g>
</svg>
